trigger: 
 branches:
   include:
     - feature3
   exclude:
     - master  
     - features-branch

pool: namopool

stages:

- stage: terraformtoolinstaller
  jobs:

  - job: terraforminit
    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: terrafom init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/rg_code'
        backendServiceArm: 'namoservice'
        backendAzureRmStorageAccountName: 'namostg123'
        backendAzureRmContainerName: 'infracontainer'
        backendAzureRmKey: 'rg.tfstate'

    - task: TerraformTask@5
      displayName: terraform fmt
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(System.DefaultWorkingDirectory)/rg_code'
        outputTo: 'console'
        customCommand: 'fmt'
        environmentServiceNameAzureRM: 'namoservice'

    - task: TerraformTask@5
      displayName: terraform validate
      inputs:
        provider: 'azurerm'
        command: 'custom'
        workingDirectory: '$(System.DefaultWorkingDirectory)/rg_code'
        outputTo: 'console'
        customCommand: 'validate'
        environmentServiceNameAzureRM: 'namoservice'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/rg_code'
        environmentServiceNameAzureRM: 'namoservice'
        

  

- stage: scanningtool
  jobs:

  - job: scanning
    steps:

    - task: PowerShell@2
      displayName: tflint scan
      continueOnError: true
      inputs:
        targetType: 'inline'
        workingDirectory: '$(System.DefaultWorkingDirectory)/rg_code'
        script: |
          Invoke-WebRequest -Uri "https://github.com/terraform-linters/tflint/releases/latest/download/tflint_windows_amd64.zip" -OutFile "tflint.zip"

          Expand-Archive -Path "tflint.zip" -DestinationPath "C:\tflint" -Force

          $env:Path += ";C:\tflint"

          tflint --version
          tflint --init
          tflint

    # - task: PowerShell@2
    #   displayName: checkov
    #   inputs:
    #     targetType: 'inline'
    #     workingDirectory: '$(System.DefaultWorkingDirectory)/Environment/Dev'
    #     script: |
    #       Invoke-WebRequest -Uri "https://github.com/bridgecrewio/checkov/releases/download/3.3.8/checkov_windows_X86_64.zip"
          
    #       python -m pip install --upgrade pip
          
    #                 python -m pip install checkov
          
    #                 checkov --version
          
    #       checkov -d .
    - task: tfsec@1
      inputs:
        version: 'v1.26.0'

