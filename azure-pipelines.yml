- stage: terraformapply
  jobs:

  - job: terraforminit
    steps:

    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTask@5
      displayName: terrafom init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/rg_code'
        backendServiceArm: 'namoservice'
        backendAzureRmStorageAccountName: 'namostg123'
        backendAzureRmContainerName: 'infracontainer'
        backendAzureRmKey: 'rg1.tfstate'
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/rg_code'
        commandOptions: '--auto-approve'
        environmentServiceNameAzureRM: 'namoservice'